name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare protected test temporary root
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test_root="$(mktemp -d "$RUNNER_TEMP/t.XXXXXX")"
          chmod 0700 "$test_root"
          ancestor="$test_root"
          while :; do
            test ! -L "$ancestor"
            read -r owner mode < <(stat -c '%u %a' "$ancestor")
            if (( (8#$mode & 07022) != 0 || (owner != 0 && owner != EUID) )) || { test "$ancestor" = / && (( owner != 0 )); }; then
              printf 'protected_fixture_temp_ancestry: unsafe ancestor %s\n' "$ancestor" >&2
              exit 1
            fi
            test "$ancestor" != / || break
            ancestor="$(dirname "$ancestor")"
          done
          printf 'TMPDIR=%s\nGOTMPDIR=%s\n' "$test_root" "$test_root" >> "$GITHUB_ENV"
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if test -n "$out"; then
            printf '%s\n' "$out"
          fi
          test -z "$out"
      - name: Report kernel and loader prerequisites
        continue-on-error: true
        run: |
          cat /etc/os-release
          uname -r
          ldd --version
          sha256sum /etc/ld.so.cache
          ldconfig -p
          command -v strace || true
          cat /proc/sys/kernel/yama/ptrace_scope || true
          cat /proc/sys/kernel/unprivileged_userns_clone || true
      - name: Test without provisioned host fixtures
        env:
          SWARMA_TEST_UNPRIVILEGED: '1'
        run: |
          export GO="$(command -v go)"
          go test -v -p 1 -count=1 -timeout=20m ./...
          go test -race -v -p 1 -count=1 -timeout=3m ./internal/egress ./internal/wire ./internal/store
      - name: Test tagged consumer fixtures
        run: go test -p 1 -tags=swarma_timeconf_fixture ./timeconftest -count=1

  privileged-protectedio:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Replay exactly the privileged residual in a private mount namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test_root="$(mktemp -d "$RUNNER_TEMP/p.XXXXXX")"
          chmod 0700 "$test_root"
          mkdir "$test_root/evidence"
          printf 'PRIVILEGED_EVIDENCE=%s/evidence\n' "$test_root" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$test_root/evidence/source-commit.txt"
          sudo -- unshare --mount --propagation private -- /bin/bash -s -- "$GITHUB_WORKSPACE" "$test_root" "$(command -v go)" <<'ROOT'
          set -euo pipefail
          source_root="$1"
          test_root="$(cd "$2" && pwd -P)"
          go_binary="$3"
          test "$(id -u)" = 0
          mkdir -p "$test_root"/{home,work,config,cache,go-build,go-mod,go-path,tmp}
          export HOME="$test_root/home" USERPROFILE="$test_root/home"
          export XDG_CONFIG_HOME="$test_root/config" XDG_CACHE_HOME="$test_root/cache"
          export GOCACHE="$test_root/go-build" GOMODCACHE="$test_root/go-mod" GOPATH="$test_root/go-path"
          export TMPDIR="$test_root/tmp" TMP="$test_root/tmp" TEMP="$test_root/tmp" GOTMPDIR="$test_root/tmp"
          export GOTOOLCHAIN=local GOTELEMETRY=off GOMAXPROCS=2 GOENV=off
          export PATH="$(dirname "$go_binary"):/usr/bin:/bin"
          unset GOTELEMETRYDIR GOFLAGS
          tar -C "$source_root" --exclude=.git --exclude=.temp -cf "$test_root/source.tar" .
          tar -C "$test_root/work" -xf "$test_root/source.tar"
          cd "$test_root/work"
          run_check() {
            name="$1"
            shift
            set +e
            "$@" > "$test_root/evidence/$name.log" 2>&1
            status="$?"
            set -e
            printf '%s\n' "$status" > "$test_root/evidence/$name.exit"
            cat "$test_root/evidence/$name.log"
            return "$status"
          }
          run_check toolchain "$go_binary" version
          run_check modules "$go_binary" mod download
          run_check verify "$go_binary" mod verify
          run_check build "$go_binary" build ./...
          run_check vet "$go_binary" vet ./...
          run_check vet-privileged "$go_binary" vet -tags privileged ./...
          run_check driver-tests "$go_binary" test -count=1 ./internal/protectedio/testdata/mutation
          run_check residual "$go_binary" run ./internal/protectedio/testdata/mutation \
            -root "$PWD" -privileged -scratch "$test_root/mutations" \
            -output "$test_root/evidence/privileged.jsonl" \
            -audit-output "$test_root/evidence/results.tsv"
          ROOT
      - name: Preserve privileged receipts and evidence-gated audit table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protectedio-privileged-residual
          path: ${{ env.PRIVILEGED_EVIDENCE }}
          if-no-files-found: error
