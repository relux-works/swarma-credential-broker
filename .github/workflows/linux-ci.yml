name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if test -n "$out"; then
            printf '%s\n' "$out"
          fi
          test -z "$out"
      - name: Report kernel and loader prerequisites
        continue-on-error: true
        run: |
          cat /etc/os-release
          uname -r
          ldd --version
          sha256sum /etc/ld.so.cache
          ldconfig -p
          command -v strace || true
          cat /proc/sys/kernel/yama/ptrace_scope || true
          cat /proc/sys/kernel/unprivileged_userns_clone || true
      - name: Test without provisioned host fixtures
        env:
          SWARMA_TEST_UNPRIVILEGED: '1'
        run: |
          export GO="$(command -v go)"
          go test -v -p 1 -count=1 -timeout=20m ./...
          go test -race -v -p 1 -count=1 -timeout=3m ./internal/egress ./internal/wire ./internal/store
      - name: Test tagged consumer fixtures
        run: go test -p 1 -tags=timeconf_fixture ./timeconftest -count=1
